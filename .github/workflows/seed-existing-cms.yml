name: Seed existing CMS content
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cms-full-existing-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node seed-existing.js
      - name: Commit seeded records and homepage media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/homepage data/press data/exhibitions media
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Seed all existing CMS records and homepage media [skip seed]"
          git push origin HEAD:cms-full-existing-content
