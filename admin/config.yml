backend:
  name: git-gateway
  repo: ninodjula-debug/lacroma
  branch: cms-complete-content

media_folder: "media"
public_folder: "/media"

collections:
  - name: "works"
    label: "Works"
    folder: "data/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Places", "Faces", "Notes", "Objects"]
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", required: false }

  - name: "exhibitions"
    label: "Exhibitions"
    folder: "data/exhibitions"
    create: true
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Internal existing-item key", name: "legacy_title", widget: "hidden", required: false }
      - { label: "Hide from site", name: "hidden", widget: "boolean", default: false, required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Venue / Location", name: "venue", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "PDF / Catalogue", name: "pdf", widget: "file", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", required: false, hint: "Smaller number appears earlier." }

  - name: "press"
    label: "Press"
    folder: "data/press"
    create: true
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Internal existing-item key", name: "legacy_title", widget: "hidden", required: false }
      - { label: "Hide from site", name: "hidden", widget: "boolean", default: false, required: false }
      - { label: "Publication", name: "publication", widget: "string", required: false }
      - { label: "Date / Year", name: "date", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "PDF", name: "pdf", widget: "file", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", required: false, hint: "Smaller number appears earlier." }

  - name: "homepage_images"
    label: "Homepage Images"
    folder: "data/homepage"
    create: true
    slug: "{{slug}}"
    summary: "{{order}} · {{category}}"
    fields:
      - { label: "Image", name: "image", widget: "image", hint: "Choose the artwork shown on the homepage." }
      - { label: "Order", name: "order", widget: "number", value_type: "int", required: false, hint: "Smaller number appears earlier. Use 10, 20, 30..." }
      - { label: "Hide from homepage", name: "hidden", widget: "boolean", default: false, required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options: ["Places", "Faces", "Notes", "Objects"]
      - { label: "Title / alt text", name: "title", widget: "string", required: false, hint: "Optional." }
      - { label: "Internal homepage position", name: "legacy_index", widget: "hidden", required: false }

  - name: "site"
    label: "Site"
    files:
      - name: "home"
        label: "Home"
        file: "data/home.yml"
        fields:
          - { label: "Hero image", name: "hero_image", widget: "image" }
          - { label: "Home text", name: "home_text", widget: "text", required: false }
      - name: "about"
        label: "About"
        file: "data/about.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Drawing", name: "drawing", widget: "text" }
          - { label: "Quote", name: "quote", widget: "text" }
          - { label: "Practice", name: "practice", widget: "text" }
          - { label: "Exhibitions paragraph", name: "exhibitions_text", widget: "text" }
          - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
      - name: "contact"
        label: "Contact"
        file: "data/contact.yml"
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - { label: "Instagram label", name: "instagram_label", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
